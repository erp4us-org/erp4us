# A schedule is required by Dependabot; zero disables regular version PRs only.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/ui"
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/services/master-data", "/services/article-delivery", "/services/inventory", "/services/procurement", "/services/manufacturing", "/services/diagnostics", "/services/sales"]
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/tests/contracts"
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
