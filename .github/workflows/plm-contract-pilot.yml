name: PLM contract pilot

on:
  pull_request:
    paths:
      - '.github/workflows/plm-contract-pilot.yml'
      - 'contracts/plm/**'
      - 'tests/contracts/plm/**'
      - 'tests/contracts/requirements.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/plm-contract-pilot.yml'
      - 'contracts/plm/**'
      - 'tests/contracts/plm/**'
      - 'tests/contracts/requirements.txt'

permissions:
  contents: read

jobs:
  released-assembly-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: '3.12' }
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python -m unittest discover -s tests/contracts/plm -v
