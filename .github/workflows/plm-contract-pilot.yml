name: PLM contract pilot

on:
  pull_request:
    paths:
      - '.github/workflows/plm-contract-pilot.yml'
      - 'contracts/plm/**'
      - 'tests/contracts/plm/**'
      - 'tests/contracts/requirements.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/plm-contract-pilot.yml'
      - 'contracts/plm/**'
      - 'tests/contracts/plm/**'
      - 'tests/contracts/requirements.txt'

permissions:
  contents: read

jobs:
  released-assembly-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python -m unittest discover -s tests/contracts/plm -v
