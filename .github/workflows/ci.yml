name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '19 6 * * 1'
  workflow_dispatch:
    inputs:
      cache_namespace:
        description: Cache namespace (use benchmark-v1 for isolated measurements)
        type: choice
        options: [v1, benchmark-v1]
        default: v1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_NAMESPACE: ${{ inputs.cache_namespace || 'v1' }}

jobs:
  impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      audit: ${{ steps.diff.outputs.audit }}
      compose: ${{ steps.diff.outputs.compose }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - name: Compare tested merge tree with its base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --no-renames --name-only -z "$BASE_SHA" HEAD | python3 scripts/ci-impact.py >> "$GITHUB_OUTPUT"
  rust:
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.rust != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - run: rustup show
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: erp4us-workspace
          prefix-key: rust-${{ env.CACHE_NAMESPACE }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Exercise Inventory reservation and replay on a replica set
        run: cargo build --locked -p inventory && python3 tests/integration/inventory.py
      - name: Exercise Procurement draft creation and lookup on a replica set
        run: cargo build --locked -p procurement && python3 tests/integration/procurement.py
      - name: Exercise the workspace broker test against real NATS
        run: |
          sh scripts/init-dev.sh
          sh tests/integration/messaging.sh
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python tests/contracts/check.py
      - name: Validate requirements, traceability and publication index
        run: |
          python tests/requirements/check.py
          python -m unittest discover -s tests/requirements
  compose:
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.compose != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: erp4us-ci
      ERP4US_HEARTBEAT_SECONDS: "2"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - run: |
          sh scripts/init-dev.sh
          python3 tests/integration/identity_fixture.py
          while IFS='=' read -r name value; do
            printf '::add-mask::%s\n' "$value"
          done < .env
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build Master Data release image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: services/master-data/Dockerfile
          tags: erp4us-ci-master-data:latest
          load: true
          cache-from: type=gha,scope=master-data-${{ env.CACHE_NAMESPACE }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,ignore-error=true,scope=master-data-{0}', env.CACHE_NAMESPACE) || '' }}
      - name: Build Article Delivery release image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: services/article-delivery/Dockerfile
          tags: erp4us-ci-article-delivery:latest
          load: true
          cache-from: type=gha,scope=article-delivery-${{ env.CACHE_NAMESPACE }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,ignore-error=true,scope=article-delivery-{0}', env.CACHE_NAMESPACE) || '' }}
      - run: docker compose config --quiet && docker compose up --no-build -d
      - run: python3 tests/integration/smoke.py --restart --outbox --units --restore
      - run: python3 tests/integration/partners.py
      - run: docker compose -f compose.yaml -f compose.delivery.yaml up --no-build -d
      - run: python3 tests/integration/delivery.py
      - run: python3 tests/integration/config.py
      - name: Scan built service images
        run: |
          sh scripts/install-dependency-scanner.sh trivy "$RUNNER_TEMP/tools"
          for service in master-data article-relay; do
            container=$(docker compose -f compose.yaml -f compose.delivery.yaml ps -q "$service")
            image=$(docker inspect --format '{{.Config.Image}}' "$container")
            "$RUNNER_TEMP/tools/trivy" image --image-src docker --scanners vuln --severity HIGH,CRITICAL \
              --format json --output "$RUNNER_TEMP/trivy.json" "$image"
            "$RUNNER_TEMP/tools/trivy" convert --format table "$RUNNER_TEMP/trivy.json"
            jq -e '[.Results[].Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length == 0' "$RUNNER_TEMP/trivy.json"
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: ui/.nvmrc, package-manager-cache: false }
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm/_cacache
          key: npm-${{ env.CACHE_NAMESPACE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/.nvmrc', 'ui/package-lock.json') }}
      - name: Build and exercise the Article workspace
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Save trusted npm download cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - if: failure()
        run: docker compose -f compose.yaml -f compose.delivery.yaml logs --no-color --tail=80
      - if: always()
        run: if [ -f .env ]; then docker compose -f compose.yaml -f compose.delivery.yaml down -v; fi
  audit:
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.audit != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - run: |
          sh scripts/install-dependency-scanner.sh cargo-audit "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/cargo-audit" audit
      - name: Check resolved crate licenses, sources and bans
        run: |
          sh scripts/install-dependency-scanner.sh cargo-deny "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/cargo-deny" --locked --workspace --all-features check licenses sources bans
