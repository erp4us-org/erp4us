[package]
name = "inventory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "=0.8.9"
erp4us-identity.workspace = true
erp4us-messaging.workspace = true
futures-util = "=0.3.32"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
mongodb = "=3.10.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
time = { version = "=0.3.55", features = ["formatting"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
uuid = { workspace = true, features = ["v4"] }
