port: 4222
http: "127.0.0.1:8222"
max_payload: 8192
jetstream {
  store_dir: "/data"
  max_file_store: 96MB
}
authorization {
  users: [
    {user: "provisioner", password: $DEV_NATS_ADMIN_PASSWORD},
    {user: "article_relay", password: $DEV_NATS_RELAY_PASSWORD, permissions: {
      publish: ["v1.business.ddcae139-c1e8-47d2-8b48-349cb6f30ce5.master-data.event.article.registered.v1",
                "v1.diagnostics.system.article-delivery.event.service.heartbeat.v1",
                "v1.config.system.article-delivery.event.heartbeat.changed.v1",
                "_INBOX.article-config-reader.>",
                "_INBOX.platform-diagnostics.>"],
      subscribe: ["_INBOX.article-relay.>",
                  "v1.config.system.article-delivery.query.heartbeat.get.v1"]
    }},
    {user: "article_replay", password: $DEV_NATS_REPLAY_PASSWORD, permissions: {
      publish: ["$JS.API.STREAM.MSG.GET.ERP4US_BUSINESS_EVENTS_V1",
                "v1.business.ddcae139-c1e8-47d2-8b48-349cb6f30ce5.master-data.event.article.registered.v1"],
      subscribe: ["_INBOX.article-replay.>"]
    }},
    {user: "article_receipts", password: $DEV_NATS_RECEIPTS_PASSWORD, permissions: {
      publish: ["$JS.API.CONSUMER.INFO.ERP4US_BUSINESS_EVENTS_V1.article-receipts",
                "$JS.API.CONSUMER.MSG.NEXT.ERP4US_BUSINESS_EVENTS_V1.article-receipts",
                "$JS.ACK.ERP4US_BUSINESS_EVENTS_V1.article-receipts.>"],
      subscribe: ["_INBOX.article-consumer.>"]
    }},
    {user: "article_config_reader", password: $DEV_NATS_CONFIG_READER_PASSWORD, permissions: {
      publish: ["v1.config.system.article-delivery.query.heartbeat.get.v1"],
      subscribe: ["_INBOX.article-config-reader.>",
                  "v1.config.system.article-delivery.event.heartbeat.changed.v1"]
    }},
    {user: "platform_diagnostics", password: $DEV_NATS_DIAGNOSTICS_PASSWORD, permissions: {
      publish: ["$JS.API.INFO",
                "$JS.API.STREAM.INFO.ERP4US_BUSINESS_EVENTS_V1",
                "$JS.API.CONSUMER.INFO.ERP4US_BUSINESS_EVENTS_V1.article-receipts",
                "$JS.API.CONSUMER.INFO.ERP4US_BUSINESS_EVENTS_V1.inventory-sales-v1",
                "$JS.API.CONSUMER.INFO.ERP4US_BUSINESS_EVENTS_V1.procurement-material-plans-v1",
                "v1.config.system.article-delivery.query.heartbeat.get.v1"],
      subscribe: ["_INBOX.platform-diagnostics.>",
                  "v1.diagnostics.system.article-delivery.event.service.heartbeat.v1"]
    }},
    {user: "sales_relay", password: $DEV_NATS_SALES_RELAY_PASSWORD, permissions: {
      publish: ["v1.business.ddcae139-c1e8-47d2-8b48-349cb6f30ce5.sales.event.order.confirmed.v1"],
      subscribe: ["_INBOX.sales-relay.>"]
    }},
    {user: "inventory_sales", password: $DEV_NATS_INVENTORY_PASSWORD, permissions: {
      publish: ["$JS.API.CONSUMER.INFO.ERP4US_BUSINESS_EVENTS_V1.inventory-sales-v1",
                "$JS.API.CONSUMER.MSG.NEXT.ERP4US_BUSINESS_EVENTS_V1.inventory-sales-v1",
                "$JS.ACK.ERP4US_BUSINESS_EVENTS_V1.inventory-sales-v1.>"],
      subscribe: ["_INBOX.inventory-sales.>"]
    }},
    {user: "inventory_plan_relay", password: $DEV_NATS_INVENTORY_PLAN_PASSWORD, permissions: {
      publish: ["v1.business.ddcae139-c1e8-47d2-8b48-349cb6f30ce5.inventory.event.material-plan.netted.v1"],
      subscribe: ["_INBOX.inventory-plan-relay.>"]
    }},
    {user: "procurement_inventory", password: $DEV_NATS_PROCUREMENT_PASSWORD, permissions: {
      publish: ["$JS.API.CONSUMER.INFO.ERP4US_BUSINESS_EVENTS_V1.procurement-material-plans-v1",
                "$JS.API.CONSUMER.MSG.NEXT.ERP4US_BUSINESS_EVENTS_V1.procurement-material-plans-v1",
                "$JS.ACK.ERP4US_BUSINESS_EVENTS_V1.procurement-material-plans-v1.>"],
      subscribe: ["_INBOX.procurement-inventory.>"]
    }}
  ]
}
