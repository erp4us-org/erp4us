x-procurement: &procurement
  image: ${COMPOSE_PROJECT_NAME:-erp4us}-procurement
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
x-procurement-scope: &procurement-scope
  PROCUREMENT_TENANT_ID: ddcae139-c1e8-47d2-8b48-349cb6f30ce5
  PROCUREMENT_ORGANIZATION_ID: 3e793fb5-75a7-45f6-8f66-45a58fcec674
x-procurement-env: &procurement-env
  PROCUREMENT_MONGO_URI: mongodb://procurement_app:${DEV_PROCUREMENT_MONGO_PASSWORD:?Generate a local Procurement password}@mongo:27017/procurement?replicaSet=erp4us&serverSelectionTimeoutMS=3000&w=majority

services:
  procurement-db-init:
    image: mongo:8.0.38@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01
    entrypoint: ["/bin/sh", "/opt/erp4us/init-procurement-db.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev_mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${DEV_MONGO_ROOT_PASSWORD:?Run sh scripts/init-dev.sh first}
      DEV_PROCUREMENT_MONGO_PASSWORD: ${DEV_PROCUREMENT_MONGO_PASSWORD:?Generate a local Procurement password}
    volumes:
      - ./infrastructure/compose/init-procurement-db.sh:/opt/erp4us/init-procurement-db.sh:ro
    depends_on:
      mongo:
        condition: service_healthy
  procurement:
    <<: *procurement
    build:
      context: .
      dockerfile: services/procurement/Dockerfile
    command: ["serve"]
    environment:
      <<: *procurement-env
      ERP4US_BIND: 0.0.0.0:8094
      ERP4US_IDENTITY_POLICY: /etc/erp4us/identity-policy.json
      ERP4US_ISSUER_JWKS: /etc/erp4us/issuer-jwks.json
    volumes:
      - type: bind
        source: ${ERP4US_IDENTITY_DIR:-./.dev-auth}/identity-policy.json
        target: /etc/erp4us/identity-policy.json
        read_only: true
      - type: bind
        source: ${ERP4US_IDENTITY_DIR:-./.dev-auth}/issuer-jwks.json
        target: /etc/erp4us/issuer-jwks.json
        read_only: true
    ports:
      - "127.0.0.1:${ERP4US_PROCUREMENT_PORT:-8094}:8094"
    depends_on:
      procurement-db-init:
        condition: service_completed_successfully
  procurement-consumer-init:
    <<: *procurement
    command: ["provision-consumer"]
    environment:
      <<: *procurement-scope
      NATS_URL: nats://nats:4222
      NATS_PASSWORD: ${DEV_NATS_ADMIN_PASSWORD:?Run sh scripts/init-dev.sh first}
    depends_on:
      delivery-init:
        condition: service_completed_successfully
  procurement-worker:
    <<: *procurement
    command: ["consume"]
    restart: on-failure
    environment:
      <<: [*procurement-scope, *procurement-env]
      NATS_URL: nats://nats:4222
      NATS_PASSWORD: ${DEV_NATS_PROCUREMENT_PASSWORD:?Generate a local Procurement consumer password}
    depends_on:
      procurement-db-init:
        condition: service_completed_successfully
      procurement-consumer-init:
        condition: service_completed_successfully
