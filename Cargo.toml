[workspace]
members = ["crates/erp4us-identity", "crates/erp4us-messaging", "services/master-data", "services/article-delivery", "services/inventory", "services/procurement", "services/manufacturing", "services/diagnostics", "services/sales"]
resolver = "3"

[workspace.package]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
erp4us-identity = { path = "crates/erp4us-identity", version = "0.1.0" }
erp4us-messaging = { path = "crates/erp4us-messaging", version = "0.1.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
uuid = { version = "=1.23.1", features = ["serde"] }
