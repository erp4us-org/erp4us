openapi: 3.1.0
info:
  title: erp4us Master Data
  version: 0.2.0
servers:
  - url: http://127.0.0.1:8080
security:
  - AccessToken: []
paths:
  /v1/session:
    get:
      operationId: getVerifiedSession
      description: Return the operator-configured actor and grants for this verified bearer. Does not accept a tenant or organization selector.
      responses:
        '200':
          description: Actor and its organization-scoped permission grants. Not cacheable.
          content:
            application/json:
              schema:
                type: object
                required: [actor_id, grants]
                properties:
                  actor_id: { type: string, format: uuid }
                  platform_permissions: { type: array, items: { type: string } }
                  grants:
                    type: array
                    items:
                      type: object
                      required: [tenant_id, organization_id, permissions]
                      properties:
                        tenant_id: { type: string, format: uuid }
                        organization_id: { type: string, format: uuid }
                        permissions: { type: array, items: { type: string } }
        '401': { description: Missing or invalid access token }
        '403': { description: No operator grant policy for the principal }
  /v1/articles:register:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Organization'
    post:
      operationId: registerArticle
      description: Register a unique SKU in the authenticated scope. A repeated SKU returns 409. Request bodies are limited to 4096 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/register-article-v1.json
      responses:
        '201':
          description: Article registered.
          headers:
            traceparent:
              description: Server-generated W3C trace context also recorded on the registration event.
              schema:
                type: string
                pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-00$'
            Location:
              required: true
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: ../schemas/article-v1.json }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/articles/{id}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Organization'
    get:
      operationId: getArticle
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Article in the authenticated scope.
          content:
            application/json:
              schema: { $ref: ../schemas/article-v1.json }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/units:register:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Organization'
    post:
      operationId: registerUnit
      description: Register a local unit code unique within the authenticated tenant and organization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/register-unit-v1.json }
      responses:
        '201':
          description: Unit registered.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: ../schemas/unit-v1.json }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/units/{id}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Organization'
    get:
      operationId: getUnit
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Unit in the authenticated scope.
          content:
            application/json:
              schema: { $ref: ../schemas/unit-v1.json }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/partners:
    get:
      operationId: listPartners
      description: List partners in the authorized organization ordered by code. The cursor is exclusive and scoped by the same filters.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Organization'
        - in: query
          name: role
          schema: { type: string, enum: [customer, supplier] }
        - in: query
          name: after
          schema: { type: string, pattern: '^[A-Z0-9-]{1,32}$' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200':
          description: Scoped page. Null cursor indicates the final page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after]
                properties:
                  items: { type: array, items: { $ref: '../schemas/partner-v1.json' } }
                  next_after: { type: [string, 'null'] }
        '400': { description: 'Invalid scope, filter, or cursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/partners:register:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Organization'
    post:
      operationId: registerPartner
      description: Register a partner with one or both commercial roles. Codes are unique in the authenticated tenant and organization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/register-partner-v1.json }
      responses:
        '201':
          description: Partner registered.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: ../schemas/partner-v1.json }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/partners/{id}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Organization'
    get:
      operationId: getPartner
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Partner in the authenticated scope.
          content:
            application/json:
              schema: { $ref: ../schemas/partner-v1.json }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /health/live:
    get:
      operationId: live
      security: []
      responses:
        '204': { description: Process is listening. }
  /health/ready:
    get:
      operationId: ready
      security: []
      responses:
        '204': { description: Database is reachable. }
        '503': { description: Database is unavailable. }
components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 OAuth access token issued for the configured resource audience.
  parameters:
    Tenant:
      in: header
      name: X-Erp4us-Tenant
      description: Requested tenant; access requires a matching grant.
      required: true
      schema: { type: string, format: uuid }
    Organization:
      in: header
      name: X-Erp4us-Organization
      description: Requested organization within the tenant; access requires a matching grant.
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: A valid bearer access token is required.
      headers:
        WWW-Authenticate:
          required: true
          schema: { const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The authenticated subject has no grant for this operation in the selected scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: The request was rejected or the persistence service is unavailable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [status, detail]
      properties:
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
